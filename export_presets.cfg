[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt"
exclude_filter="src/dev/*, tools/*, build/*, *.md"
export_path="build/web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://tools/web/shell.html"
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\"><style>html,body,#canvas{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}</style><script>(function(){document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});var coarse=navigator.maxTouchPoints>0&&window.matchMedia&&matchMedia('(pointer: coarse)').matches;if(!coarse||/[?&]fs=0/.test(location.search))return;var done=false;document.addEventListener('touchend',function(){if(done)return;done=true;var el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;if(!rq||document.fullscreenElement||document.webkitFullscreenElement)return;try{var p=rq.call(el,{navigationUI:'hide'});if(p&&p.then){p.then(function(){try{if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}catch(e){}}).catch(function(){});}}catch(e){}},{passive:true});})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
